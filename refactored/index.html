<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Question Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <!-- Third-party libraries stay as classic (non-module) scripts so their globals
       ($, bootstrap, Papa, Sortable) remain available to the ES modules below. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>

<body>

  <div class="app-header">
    <div class="container">
      <div>
        <h1>Interview Question Viewer</h1>
        <p class="header-breadcrumb" id="headerBreadcrumb"></p>
      </div>
      <div class="timer-widget">
        <span class="timer-display" id="timerDisplay">00:00:00</span>
        <button type="button" class="btn btn-outline-success" id="timerStartBtn">Start</button>
        <button type="button" class="btn btn-outline-warning" id="timerPauseBtn">Pause</button>
        <button type="button" class="btn btn-outline-secondary" id="timerResetBtn">Reset</button>
      </div>
    </div>
  </div>

  <div class="container pb-5">

    <div id="controlsWrapper">
      <div class="toolbar-card p-3 mb-3">
        <div class="row g-2 align-items-center">
          <div class="col-auto">
            <label class="btn btn-primary mb-0">
              <i class="fa-solid fa-upload"></i> CSV
              <input type="file" id="csvInput" accept=".csv" hidden>
            </label>
          </div>
          <div class="col-auto">
            <div class="form-check form-switch mt-2">
              <input class="form-check-input" type="checkbox" id="tempModeToggle">
            </div>
          </div>
          <div class="col-auto">
            <button id="loadCsvStringBtn" class="btn btn-outline-primary" title="Loads data.js's csvString if present, otherwise a built-in sample question set"><i class="fa-solid fa-circle-play"></i> Load Sample</button>
          </div>

          <div class="col-auto">
            <button id="downloadProgressBtn" class="btn btn-outline-success" disabled><i class="fa-solid fa-download"></i> Export</button>
          </div>
          <div class="col-auto">
            <select id="csvSwitcher" class="form-select" style="min-width:180px;" disabled>
              <option value="">No CSV loaded</option>
            </select>
          </div>
          <div class="col-auto">
            <button id="resetAllBtn" class="btn btn-outline-danger" disabled><i class="fa-regular fa-circle-xmark"></i> Reset All</button>
          </div>
          <div class="col-auto ms-auto" style="display: none;">
            <span id="statusMsg" class="text-muted small"></span>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end mb-2">
        <a href="#" id="filterCardToggleLink" class="small text-decoration-none">Show Filters ▾</a>
      </div>

      <div class="filter-card p-3 mb-3" id="filterCard" style="display:none;">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label small fw-bold">Subject</label>
            <select id="subjectFilter" class="form-control" multiple></select>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">Topic</label>
            <select id="topicFilter" class="form-control" multiple></select>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">SubTopic</label>
            <select id="subTopicFilter" class="form-control" multiple></select>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">Status</label>
            <select id="statusFilter" class="form-control" multiple>
              <option value="Done">Done</option>
              <option value="ReviewLater">Review Later</option>
              <option value="Duplicate">Duplicate</option>
              <option value="LessImportant">Less Important</option>
              <option value="Starred">Starred</option>
            </select>
          </div>
        </div>
        <div class="mt-2 d-flex justify-content-end align-items-center">
          <button id="clearFiltersBtn" class="btn btn-sm btn-outline-secondary">Clear Filters</button>
        </div>
      </div>
    </div>

    <div id="globalStatsBadges" class="global-stats-badges"></div>

    <div class="mb-3" id="questionSearchWrap" style="display:none;">
      <label class="form-label small fw-bold" for="questionSearchInput">Jump to Question</label>
      <div class="input-group">
        <input type="text" id="questionSearchInput" class="form-control"
          placeholder="Search questions by subject / topic / subtopic / text...">
        <button type="button" id="questionSearchClearBtn" class="btn btn-outline-secondary" title="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="questionSearchResults" class="mt-2"></div>
    </div>

    <div id="rootAccordion"></div>

  </div>

  <div id="globalAlertHolder" class="global-alert-holder"></div>

  <div class="floating-toggles">
    <button type="button" id="closeAllAccordionsBtn" class="floating-toggle-item btn btn-outline-secondary btn-rounded" title="Close all open accordions">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
    <label class="floating-toggle-item editModeToggle btn btn-outline-secondary btn-rounded" title="Edit Mode: ON shows every control; OFF hides the toolbar/filter/add-new cards plus editing-only actions (drag, edit, copy, move, delete, duplicate)">
      <input type="checkbox" id="editModeToggle" class="visually-hidden">
      <i class="fa-solid fa-pen" aria-hidden="true"></i>
    </label>
  </div>

  <script type="module" src="./js/app.js"></script>
  <!-- Optional: define `const csvString = "...";` in a sibling data.js to have
       "Load Sample" use it instead of the built-in sample set. Safe to omit entirely. -->
  <script src="data.js"></script>
</body>

</html>
